<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game History | Painel de Mensagens</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <nav class="navbar">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-gamepad"></i> GAME<span>HISTORY</span>
            </a>
            
            <ul class="nav-menu">
                <li><a href="../index.html">Início</a></li>
                <li><a href="rdr2.html">Red Dead 2</a></li>
                <li><a href="tlou.html">The Last of Us</a></li>
                <li><a href="witcher.html">The Witcher</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="#" id="btn-logout" style="color: var(--accent-red);"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></li>
            </ul>

            <!-- Elemento de áudio (invisível) -->
            <audio id="bg-audio" src="../sound/zephira.mp3" loop></audio>

            <!-- Botão de controle no Header/Navbar -->
            <button id="music-toggle" class="music-btn" title="Alternar Música">
                <i class="fa-solid fa-volume-xmark"></i>
            </button>

            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <!-- Main do Painel de Mensagens -->
    <main class="contact-main">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h2>Painel do Administrador</h2>
                    <p style="color: var(--text-secondary);">Mensagens enviadas pelos usuários através do formulário de contato.</p>
                </div>
                <button id="btn-limpar-tudo" class="btn-primary" style="background-color: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); padding: 0.6rem 1.2rem; font-size: 0.9rem;">
                    <i class="fa-solid fa-trash"></i> Limpar Mensagens
                </button>
            </div>

            <!-- Container onde as mensagens serão injetadas via JavaScript -->
            <div id="mensagens-container" style="display: grid; gap: 1.5rem;">
                <!-- O JavaScript vai preencher os cards de mensagens aqui dinamicamente -->
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container">
            <span>&copy; 2026 Game History. Todos os direitos reservados ao grupo de desenvolvimento.</span>
        </div>
    </footer>

    <!-- Script JavaScript -->
    <script src="../js/main.js"></script>
    <script src="../js/audio.js"></script>
    <script src="../js/mensagem.js"></script>
</body>
</html>
